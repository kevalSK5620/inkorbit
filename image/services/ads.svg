<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" preserveAspectRatio="xMidYMid slice"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FF3CC8"/><stop offset=".5" stop-color="#8A4DFF"/><stop offset="1" stop-color="#00D1FF"/></linearGradient><linearGradient id="g2" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#3B82FF"/><stop offset="1" stop-color="#00D1FF"/></linearGradient></defs><style>.rot{transform-box:fill-box;transform-origin:center;animation:spin 14s linear infinite}.bar{transform-box:fill-box;transform-origin:50% 100%;animation:grow 3.2s ease-in-out infinite}.pu{transform-box:fill-box;transform-origin:center;animation:pulse 2.4s ease-in-out infinite}.fl{animation:float 4s ease-in-out infinite}.dash{stroke-dasharray:6 8;animation:dash 1.4s linear infinite}.ex{transform-box:fill-box;transform-origin:center;animation:expand 2.6s ease-out infinite}.dr{stroke-dasharray:600;animation:draw 3.4s ease-in-out infinite}@keyframes spin{to{transform:rotate(360deg)}}@keyframes grow{0%,100%{transform:scaleY(.35)}50%{transform:scaleY(1)}}@keyframes pulse{50%{transform:scale(1.5);opacity:.6}}@keyframes float{50%{transform:translateY(-12px)}}@keyframes dash{to{stroke-dashoffset:-28}}@keyframes expand{from{transform:scale(.4);opacity:.9}to{transform:scale(1.8);opacity:0}}@keyframes draw{0%{stroke-dashoffset:600}60%,100%{stroke-dashoffset:0}}</style><rect width="600" height="380" fill="#0A1030"/><g fill="none"><circle cx="170" cy="190" r="120" stroke="#ffffff1a" stroke-width="2"/><circle cx="170" cy="190" r="84" stroke="#8A4DFF" stroke-width="3"/><circle cx="170" cy="190" r="48" stroke="#FF3CC8" stroke-width="3"/><circle class="pu" cx="170" cy="190" r="14" fill="#00D1FF"/></g><path d="M40 190h260M170 60v260" stroke="#ffffff22"/><g transform="translate(330 70)"><path d="M0 220h240" stroke="#ffffff33"/><polyline class="dr" points="0,200 50,170 90,180 140,110 190,80 240,20" fill="none" stroke="url(#g)" stroke-width="7" s