<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" preserveAspectRatio="xMidYMid slice"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FF3CC8"/><stop offset=".5" stop-color="#8A4DFF"/><stop offset="1" stop-color="#00D1FF"/></linearGradient><linearGradient id="g2" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#3B82FF"/><stop offset="1" stop-color="#00D1FF"/></linearGradient></defs><style>.rot{transform-box:fill-box;transform-origin:center;animation:spin 14s linear infinite}.bar{transform-box:fill-box;transform-origin:50% 100%;animation:grow 3.2s ease-in-out infinite}.pu{transform-box:fill-box;transform-origin:center;animation:pulse 2.4s ease-in-out infinite}.fl{animation:float 4s ease-in-out infinite}.dash{stroke-dasharray:6 8;animation:dash 1.4s linear infinite}.ex{transform-box:fill-box;transform-origin:center;animation:expand 2.6s ease-out infinite}.dr{stroke-dasharray:600;animation:draw 3.4s ease-in-out infinite}@keyframes spin{to{transform:rotate(360deg)}}@keyframes grow{0%,100%{transform:scaleY(.35)}50%{transform:scaleY(1)}}@keyframes pulse{50%{transform:scale(1.5);opacity:.6}}@keyframes float{50%{transform:translateY(-12px)}}@keyframes dash{to{stroke-dashoffset:-28}}@keyframes expand{from{transform:scale(.4);opacity:.9}to{transform:scale(1.8);opacity:0}}@keyframes draw{0%{stroke-dashoffset:600}60%,100%{stroke-dashoffset:0}}</style><rect width="600" height="380" fill="#0C0820"/><g stroke="url(#g)" stroke-width="2" fill="none" class="dash"><path d="M90 190L230 90M90 190L230 190M90 190L230 290M230 90L370 140M230 190L370 140M230 190L370 240M230 290L370 240M370 140L510 190M370 240L510 190"/></g><g fill="#05040A" stroke="#00D1FF" stroke-width="3"><circle cx="90" cy="190" r="16" class="pu"/><circle cx="230" cy="90" r="16"/><circle cx="230" cy="190" r="16" class="pu"/><circle cx="230" cy="290" r="16"/><circle cx="370" cy="140" r="16" class="pu"/><circle cx="370" cy="240" r="16"/></g><circle cx="510" cy="190